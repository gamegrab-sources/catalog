# Builds this catalog's web page from the committed index.json and deploys it with GitHub Pages:
#   https://gamegrab-sources.github.io/catalog/
# tools/site/ is a copy of the generator in Droidtop/droidtop.github.io (generator/), the way
# tools/build_index.py is a copy of droidtop-platforms' script. The page opens with this catalog's
# disclaimer. It lives in this organisation, not in droidtop's.
name: Catalog page

on:
  workflow_run:
    workflows: ["Catalog index"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "53 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/site/**"
      - ".github/workflows/site.yml"

permissions:
  contents: read

concurrency:
  group: catalog-page
  cancel-in-progress: false

env:
  REGISTRY: https://raw.githubusercontent.com/Droidtop/droidtop/main/plugin-host/src/main/kotlin/dev/droidtop/pluginhost/PluginPermissions.kt

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test the generator
        run: python3 tools/site/test_build_site.py
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the page
        run: python3 tools/site/build_site.py --index index.json --address https://github.com/gamegrab-sources/catalog --registry "$REGISTRY" --out _site
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
